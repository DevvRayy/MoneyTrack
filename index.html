<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#0B1020" />
<title>MoneyTrack — Manajemen Keuangan Pelajar</title>
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="stylesheet" href="style.css" />
</head>
<body>
<div id="app">
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="brand-logo">💰</div>
      <div class="brand-text">
        <div class="brand-name">MoneyTrack</div>
        <div class="brand-sub">Keuangan Pelajar</div>
      </div>
    </div>
    <nav class="nav" id="navList"></nav>
    <div class="sidebar-foot">
      <div id="storageWarn" class="storage-warn hidden">⚠️ Penyimpanan tidak tersedia. Data tidak akan tersimpan.</div>
    </div>
  </aside>

  <div class="main">
    <header class="topbar">
      <button class="icon-btn only-mobile" id="btnMenu" aria-label="Buka menu">☰</button>
      <div class="topbar-title" id="pageTitle">Dashboard</div>
      <div class="topbar-right">
        <div class="pill" id="todayPill">—</div>
        <button class="icon-btn" id="btnTheme" aria-label="Ganti tema">🌙</button>
      </div>
    </header>
    <main class="content" id="content"></main>
  </div>

  <nav class="bottomnav" id="bottomNav"></nav>
</div>

<div class="drawer-backdrop" id="drawerBackdrop"></div>
<div class="modal-root" id="modalRoot"></div>
<div class="toast-root" id="toastRoot"></div>
<div class="loading" id="loading"><div class="spinner"></div></div>
<div class="mt-audio-pulse" id="mtAudioPulse"></div>
<script src="script.js"></script>
</body>
</html>
